server:
  port: 8088

spring:
  application:
    name: gateway
  # optional：Nacos 不可达时仍按本地路由启动，开发机与测试不必先起配置中心
  config:
    import:
      - optional:nacos:ai-gateway.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  cloud:
    nacos:
      config:
        serverAddr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          # R8 租户维度：一个租户一个桶，交给 RequestRateLimiter（它写 X-RateLimit-* 头，
          # 拒绝语义也是客户端熟悉的那套）。厂商维度在 ProviderQuotaFilter 里自己做——
          # 同一条路由挂两个 RequestRateLimiter，后一个会把前一个的配额覆盖掉，
          # 见 docs/requirements.md 决策 D5。
          default-filters:
            - name: RequestRateLimiter
              args:
                keyResolver: "#{@tenantKeyResolver}"
                redis-rate-limiter.replenishRate: ${ai-gateway.rate-limit.tenant-replenish-rate}
                redis-rate-limiter.burstCapacity: ${ai-gateway.rate-limit.tenant-burst-capacity}
                redis-rate-limiter.requestedTokens: ${ai-gateway.rate-limit.tenant-requested-tokens}
          # 路由表。Nacos 里的 ai-gateway.yaml 覆盖这一段，改完即时生效——
          # spring-cloud-gateway 的 RouteRefreshListener 监听配置刷新事件。
          # 上游凭证用 SetRequestHeader 注入：网关不改写报文，只换 host、归一 path、换 key。
          #
          # R6 拓扑：两家互为备份。公开路由挂熔断，失败时 forward 到一条内部备份路由，
          # 由 DispatcherHandler 重新匹配——这是 CircuitBreaker 的 fallbackUri 能改道到
          # 另一个厂商的原因（它 reset 掉上游连接后重走一遍 handler 分发）。
          # 顺序要求：CircuitBreaker 必须排在 SetPath / SetRequestHeader **之前**。它改道时用的
          # 是自己看到的那个 request，若厂商 key 已被前面的过滤器换进去，重投递时鉴权读到的
          # 就是厂商 key，直接 401（实测踩过）。
          # 一条现实约束：改道之后的请求体里 model 还是原厂商的名字，两家都能服务的模型才能这样
          # 互为备份；要按厂商改写 model 就得动报文，与决策 D1 相冲，留给 R3 一并解决（见 D6）。
          routes:
            # R3 模型路由：同一个 /v1/chat/completions 入口，按请求体里的 model 选厂商。
            # 顺序就是优先级——SCG 取第一条匹配的路由，所以专名放前面、兜底放后面。
            - id: deepseek-by-model
              uri: https://api.deepseek.com
              predicates:
                - Path=/v1/chat/completions
                - Model=deepseek*
              metadata:
                provider: deepseek
                response-timeout: 120000
                connect-timeout: 3000
              filters:
                - name: CircuitBreaker
                  args:
                    name: deepseek
                    fallbackUri: forward:/backup/dashscope/v1/chat/completions
                - SetPath=/v1/chat/completions
                - SetRequestHeader=Authorization,Bearer ${DEEPSEEK_API_KEY:}
            - id: dashscope-chat
              uri: https://dashscope.aliyuncs.com
              predicates:
                - Path=/v1/chat/completions
              metadata:
                provider: dashscope
                # 单位是毫秒，且必须是数字：NettyRoutingFilter 用 Long.parseLong /
                # Integer.parseInt 读这两个键，写 "120s" 会被静默忽略（response-timeout 回落到
                # 全局值）或直接抛 NumberFormatException（connect-timeout）。见 docs/requirements.md D2
                response-timeout: 120000
                connect-timeout: 3000
              filters:
                - name: CircuitBreaker
                  args:
                    name: dashscope
                    fallbackUri: forward:/backup/deepseek/v1/chat/completions
                - SetPath=/compatible-mode/v1/chat/completions
                - SetRequestHeader=Authorization,Bearer ${DASHSCOPE_API_KEY:}
            # 一期用路径前缀区分厂商：客户端只把 base-url 换成
            # http://127.0.0.1:8088/deepseek/v1 就切了上游。按 body 里的 model 分流是四期 R3。
            - id: deepseek-chat
              uri: https://api.deepseek.com
              predicates:
                - Path=/deepseek/v1/chat/completions
              metadata:
                provider: deepseek
                response-timeout: 120000
                connect-timeout: 3000
              filters:
                - name: CircuitBreaker
                  args:
                    name: deepseek
                    fallbackUri: forward:/backup/dashscope/v1/chat/completions
                - SetPath=/v1/chat/completions
                - SetRequestHeader=Authorization,Bearer ${DEEPSEEK_API_KEY:}
            # 两条内部备份路由：只被 forward 命中，自己不再挂熔断（它们是最后那道防线）。
            # 路径带 /backup/ 前缀，客户端不该直接打——真要指定厂商，用上面两条公开路由。
            - id: backup-deepseek
              uri: https://api.deepseek.com
              predicates:
                - Path=/backup/deepseek/v1/chat/completions
              metadata:
                provider: deepseek
                response-timeout: 120000
                connect-timeout: 3000
              filters:
                - SetPath=/v1/chat/completions
                - SetRequestHeader=Authorization,Bearer ${DEEPSEEK_API_KEY:}
            - id: backup-dashscope
              uri: https://dashscope.aliyuncs.com
              predicates:
                - Path=/backup/dashscope/v1/chat/completions
              metadata:
                provider: dashscope
                response-timeout: 120000
                connect-timeout: 3000
              filters:
                - SetPath=/compatible-mode/v1/chat/completions
                - SetRequestHeader=Authorization,Bearer ${DASHSCOPE_API_KEY:}

# 自定义段用顶层前缀，不挤进 spring.*
ai-gateway:
  rate-limit:
    # 租户维度：一个租户一个桶，防的是单个调用方打爆网关
    tenant-replenish-rate: 5
    tenant-burst-capacity: 10
    # 一次调用扣几个令牌；生产上想按 token 量计价式地扣，就把它调大
    tenant-requested-tokens: 1
    # 厂商维度：一个厂商在一个窗口内允许几次，所有租户合计；0 表示关掉这一维。
    # 窗口按分钟而不是按秒：一次模型调用就要几秒到几十秒，按秒开窗永远撞不到
    provider-requests-per-window: 20
    provider-window-seconds: 60
  upstream:
    # R11：上游已经开始回话之后，连续多久没有新字节就断开。路由 metadata 的 response-timeout
    # 只管「等响应头」，管不到流中途（见 docs/requirements.md 决策 D2），所以要有这条。
    # 它是空闲计时，厂商持续吐 token 时不会触发，长回答不受影响。设 0 关闭。
    idle-timeout: 60s
  tenants:
    team-a:
      # 本地开发用的网关 key，与厂商 key 无关；上生产由 GATEWAY_TENANT_KEY 覆盖
      api-key: ${GATEWAY_TENANT_KEY:sk-team-a-local-dev}
      providers: [ dashscope, deepseek ]

resilience4j:
  circuitbreaker:
    configs:
      default:
        # 20 次滑动窗口、失败率过半就打开；打开后 30 秒放行一次探测
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    configs:
      default:
        # spring-cloud-circuitbreaker 会把每次调用包在一个 TimeLimiter 里，而它的默认
        # timeout-duration 是 1 秒——大模型调用没有 1 秒能回来的，等于每个请求都被判超时、
        # 全部走 fallback。实测：主厂商 1.006 秒正常返回，客户端拿到的却是备用厂商的 400。
        # 这里给到 120 秒，与路由的 response-timeout 对齐。
        timeout-duration: 120s

management:
  # 运维面单独端口：8088 是对外的业务端口，不该顺带把 /actuator 暴露在同一面上
  server:
    port: 8089
  tracing:
    sampling:
      # 默认 0.1。演示与排障都要每个请求有 traceId，生产按流量调回去
      probability: 1.0
    export:
      # 保持 true。实测：Boot 4 + OTel 下把它设成 false 不是「只关掉导出」——tracer 不再生成，
      # 连 traceparent 都不往厂商请求上带了，等于把链路传播一起关掉。本地没有 collector 时
      # 导出会静默失败（实测没有噪音），比丢传播划算。接 Jaeger/Tempo 时给
      # management.opentelemetry.logging.export.otlp.endpoint 指个地址。
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
