server:
  port: 8088

spring:
  application:
    name: gateway
  # optional：Nacos 不可达时仍按本地路由启动，开发机与测试不必先起配置中心
  config:
    import:
      - optional:nacos:ai-gateway.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  cloud:
    nacos:
      config:
        serverAddr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          # R8 租户维度：一个租户一个桶，交给 RequestRateLimiter（它写 X-RateLimit-* 头，
          # 拒绝语义也是客户端熟悉的那套）。厂商维度在 ProviderQuotaFilter 里自己做——
          # 同一条路由挂两个 RequestRateLimiter，后一个会把前一个的配额覆盖掉，
          # 见 docs/requirements.md 决策 D5。
          default-filters:
            - name: RequestRateLimiter
              args:
                keyResolver: "#{@tenantKeyResolver}"
                redis-rate-limiter.replenishRate: ${ai-gateway.rate-limit.tenant-replenish-rate}
                redis-rate-limiter.burstCapacity: ${ai-gateway.rate-limit.tenant-burst-capacity}
                redis-rate-limiter.requestedTokens: ${ai-gateway.rate-limit.tenant-requested-tokens}
          # 路由表由 ai-gateway.providers 生成（决策 D10，代码在 ProviderRouteDefinitionLocator）。
          # 原先手写的六条路由——两家各一条对外、一条点名前缀、一条内部备份——现在由生成器产出，
          # 路由 id 与迁移前一致。三条只能靠人记的规则也随之进了代码并被单测钉住：专名在前兜底在后、
          # CircuitBreaker 排在 SetPath/SetRequestHeader 之前（D6.1）、备份路由自己不挂熔断。
          # spring...routes 这一段仍然可用，且优先于生成的路由（生成的带 order=1000），所以它现在是
          # 逃生舱：临时手写一条顶掉某条生成路由是有效手段，不是错觉。
          #
          # 上游凭证仍由 SetRequestHeader 注入（生成器做同一件事）：网关不改写报文主体，只换 host、
          # 归一 path、换 key；模型名的定向改写是 D9 开的那个唯一例外。
          routes: []

# 自定义段用顶层前缀，不挤进 spring.*
ai-gateway:
  # 厂商声明。路由由它生成（ProviderRouteDefinitionLocator，决策 D10）：对外入口
  # /v1/chat/completions、点名入口 /{alias}/v1/chat/completions、内部备份
  # /backup/{alias}/v1/chat/completions。改这一段即时生效，靠的是 D4 那条「必须是 JavaBean」。
  #
  # 密钥走环境变量，不进仓库；没配就照常启动，调用时由厂商回 401——那是最容易被读到的信号，
  # 比网关自己编一个「key 缺失」的错误码更接近事实。生产上密钥只在进程环境里。
  providers:
    deepseek:
      base-url: https://api.deepseek.com
      chat-path: /v1/chat/completions
      key-ref: ${DEEPSEEK_API_KEY:}
      # 专名厂商：Model 谓词认领这些名字；认领了模型的排在兜底之前（顺序就是优先级，见 D7）
      models: [ deepseek* ]
      response-timeout: 120000
      connect-timeout: 3000
      backup: dashscope
      # D9：客户端传一个名字，各厂商报自己的真名。表里没有的名字原样透传，网关不替厂商编名字。
      model-mapping:
        chat-default: deepseek-v4-flash
    dashscope:
      base-url: https://dashscope.aliyuncs.com
      # 与对外入口可以不同：DashScope 的 OpenAI 兼容端点多了 /compatible-mode 一段
      chat-path: /compatible-mode/v1/chat/completions
      key-ref: ${DASHSCOPE_API_KEY:}
      models: []
      response-timeout: 120000
      connect-timeout: 3000
      backup: deepseek
      model-mapping:
        chat-default: qwen3.7-plus
      # R14：这家在 HTTP 200 的正文里自报失败时用的顶层错误码。只与顶层 code /
      # error.code / error.type 做等值比较，正文自由文本不参与判定。哪些码算属于部署
      # 事实，这里不替厂商定义；留空就只靠那条与厂商无关的结构规则（顶层有 error 且无
      # choices）。示例形状：failure-indicators: [Throttling.AllocationQuota]
      failure-indicators: []

  rate-limit:
    # 租户维度：一个租户一个桶，防的是单个调用方打爆网关
    tenant-replenish-rate: 5
    tenant-burst-capacity: 10
    # 一次调用扣几个令牌；生产上想按 token 量计价式地扣，就把它调大
    tenant-requested-tokens: 1
    # 厂商维度：一个厂商在一个窗口内允许几次，所有租户合计；0 表示关掉这一维。
    # 窗口按分钟而不是按秒：一次模型调用就要几秒到几十秒，按秒开窗永远撞不到
    provider-requests-per-window: 20
    provider-window-seconds: 60
  upstream:
    # R11：上游已经开始回话之后，连续多久没有新字节就断开。路由 metadata 的 response-timeout
    # 只管「等响应头」，管不到流中途（见 docs/requirements.md 决策 D2），所以要有这条。
    # 它是空闲计时，厂商持续吐 token 时不会触发，长回答不受影响。设 0 关闭。
    idle-timeout: 60s
  tenants:
    team-a:
      # 本地开发用的网关 key，与厂商 key 无关；上生产由 GATEWAY_TENANT_KEY 覆盖
      api-key: ${GATEWAY_TENANT_KEY:sk-team-a-local-dev}
      providers: [ dashscope, deepseek ]

resilience4j:
  circuitbreaker:
    configs:
      default:
        # 20 次滑动窗口、失败率过半就打开；打开后 30 秒放行一次探测
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    configs:
      default:
        # spring-cloud-circuitbreaker 会把每次调用包在一个 TimeLimiter 里，而它的默认
        # timeout-duration 是 1 秒——大模型调用没有 1 秒能回来的，等于每个请求都被判超时、
        # 全部走 fallback。实测：主厂商 1.006 秒正常返回，客户端拿到的却是备用厂商的 400。
        # 这里给到 120 秒，与路由的 response-timeout 对齐。
        timeout-duration: 120s

management:
  # 运维面单独端口：8088 是对外的业务端口，不该顺带把 /actuator 暴露在同一面上
  server:
    port: 8089
  otlp:
    metrics:
      export:
        # 关掉。指标已经由 8089 上的 /actuator/prometheus 被拉走，再推一份 OTLP 是第二条通路，
        # 本地没有 collector 时 OtlpHttpMetricsSender 每 30 秒打一条 ConnectException
        # （实测一次全量测试里刷了 48 行）。要推就在有 collector 的环境里打开并给 endpoint。
        enabled: false
  tracing:
    sampling:
      # 默认 0.1。演示与排障都要每个请求有 traceId，生产按流量调回去
      probability: 1.0
    export:
      # 保持 true。实测：Boot 4 + OTel 下把它设成 false 不是「只关掉导出」——tracer 不再生成，
      # 连 traceparent 都不往厂商请求上带了，等于把链路传播一起关掉，而传播才是排障要的那半。
      # 需要单独关的是指标的导出，在上面 management.otlp.metrics.export。
      # 接 Jaeger/Tempo 时给 management.opentelemetry.logging.export.otlp.endpoint 指个地址。
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
