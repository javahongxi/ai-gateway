server:
  port: 8088

spring:
  application:
    name: gateway
  # optional：Nacos 不可达时仍按本地路由启动，开发机与测试不必先起配置中心
  config:
    import:
      - optional:nacos:ai-gateway.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  cloud:
    nacos:
      config:
        serverAddr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          # 路由表。Nacos 里的 ai-gateway.yaml 覆盖这一段，改完即时生效——
          # spring-cloud-gateway 的 RouteRefreshListener 监听配置刷新事件。
          # 上游凭证用 SetRequestHeader 注入：网关不改写报文，只换 host、归一 path、换 key。
          routes:
            - id: dashscope-chat
              uri: https://dashscope.aliyuncs.com
              predicates:
                - Path=/v1/chat/completions
              metadata:
                provider: dashscope
                # 单位是毫秒，且必须是数字：NettyRoutingFilter 用 Long.parseLong /
                # Integer.parseInt 读这两个键，写 "120s" 会被静默忽略（response-timeout 回落到
                # 全局值）或直接抛 NumberFormatException（connect-timeout）。见 docs/requirements.md D2
                response-timeout: 120000
                connect-timeout: 3000
              filters:
                - SetPath=/compatible-mode/v1/chat/completions
                - SetRequestHeader=Authorization,Bearer ${DASHSCOPE_API_KEY:}
            # 一期用路径前缀区分厂商：客户端只把 base-url 换成
            # http://127.0.0.1:8088/deepseek/v1 就切了上游。按 body 里的 model 分流是四期 R3。
            - id: deepseek-chat
              uri: https://api.deepseek.com
              predicates:
                - Path=/deepseek/v1/chat/completions
              metadata:
                provider: deepseek
                response-timeout: 120000
                connect-timeout: 3000
              filters:
                - SetPath=/v1/chat/completions
                - SetRequestHeader=Authorization,Bearer ${DEEPSEEK_API_KEY:}

# 自定义段用顶层前缀，不挤进 spring.*
ai-gateway:
  upstream:
    # R11：上游已经开始回话之后，连续多久没有新字节就断开。路由 metadata 的 response-timeout
    # 只管「等响应头」，管不到流中途（见 docs/requirements.md 决策 D2），所以要有这条。
    # 它是空闲计时，厂商持续吐 token 时不会触发，长回答不受影响。设 0 关闭。
    idle-timeout: 60s
  tenants:
    team-a:
      # 本地开发用的网关 key，与厂商 key 无关；上生产由 GATEWAY_TENANT_KEY 覆盖
      api-key: ${GATEWAY_TENANT_KEY:sk-team-a-local-dev}
      providers: [ dashscope, deepseek ]

management:
  # 运维面单独端口：8088 是对外的业务端口，不该顺带把 /actuator 暴露在同一面上
  server:
    port: 8089
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
